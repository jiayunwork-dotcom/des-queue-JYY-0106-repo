<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>des-queue - Queue Simulation</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background: #f0f4f8; color: #333; padding: 24px; }
        h1 { text-align: center; margin-bottom: 20px; }
        .container { max-width: 700px; margin: 0 auto; }
        .card { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; }
        input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; margin-bottom: 12px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
        button { padding: 10px 24px; background: #4a90d9; color: #fff; border: none; border-radius: 4px; cursor: pointer; margin-right: 8px; }
        button:hover { background: #357abd; }
        .result { margin-top: 16px; background: #f8f9fa; border: 1px solid #eee; padding: 16px; border-radius: 4px; font-family: monospace; white-space: pre-wrap; }
    </style>
</head>
<body>
<div class="container">
    <h1>des-queue</h1>
    <div class="card">
        <div class="grid">
            <div><label>Lambda (arrival rate)</label><input id="lambda" type="number" value="0.5" step="0.1"></div>
            <div><label>Mu (service rate)</label><input id="mu" type="number" value="1.0" step="0.1"></div>
            <div><label>Servers</label><input id="servers" type="number" value="1"></div>
            <div><label>Customers</label><input id="customers" type="number" value="5000"></div>
            <div><label>Seed</label><input id="seed" type="number" value="42"></div>
        </div>
        <button onclick="doSimulate()">Simulate</button>
        <button onclick="doTheory()">Theory (M/M/1)</button>
        <div class="result" id="result">Results will appear here...</div>
    </div>
</div>
<script>
function params() {
    return {
        lambda: +document.getElementById('lambda').value,
        mu: +document.getElementById('mu').value,
        servers: +document.getElementById('servers').value,
        customers: +document.getElementById('customers').value,
        seed: +document.getElementById('seed').value
    };
}
async function doSimulate() {
    const res = await fetch('/api/simulate', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(params())}).then(r=>r.json());
    const el = document.getElementById('result');
    if (res.error) { el.textContent = 'Error: ' + res.error; return; }
    el.textContent = `Simulation Results (${res.served} customers served)
Rho (utilization): ${res.rho.toFixed(4)}
L (avg in system): ${res.l.toFixed(4)}
W (avg sojourn):   ${res.w.toFixed(4)}
Wq (avg wait):     ${res.wq.toFixed(4)}
Throughput:        ${res.throughput.toFixed(4)}
Theory Error: rho ${res.rho_err_pct.toFixed(2)}%, Wq ${res.wq_err_pct.toFixed(2)}%`;
}
async function doTheory() {
    const p = params();
    const res = await fetch('/api/theory', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({lambda:p.lambda, mu:p.mu})}).then(r=>r.json());
    const el = document.getElementById('result');
    if (res.error) { el.textContent = 'Error: ' + res.error; return; }
    el.textContent = `M/M/1 Theoretical Values
Rho: ${res.rho.toFixed(4)}
L:   ${res.l.toFixed(4)}
W:   ${res.w.toFixed(4)}
Wq:  ${res.wq.toFixed(4)}`;
}
</script>
</body>
</html>
